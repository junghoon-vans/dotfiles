name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          go env -w GOBIN="$HOME/.local/bin"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n \
            setup.sh \
            setup/main.sh \
            setup/lib/common.sh \
            setup/commands/* \
            setup/languages/*.sh \
            setup/blockchain/*.sh \
            setup/apps/*.sh \
            setup/check.sh \
            setup/doctor.sh \
            tests/setup/*.sh

      - name: Run shellcheck
        shell: bash
        run: |
          shellcheck -x -S warning \
            setup.sh \
            setup/main.sh \
            setup/lib/common.sh \
            setup/commands/* \
            setup/languages/*.sh \
            setup/blockchain/*.sh \
            setup/apps/*.sh \
            setup/check.sh \
            setup/doctor.sh \
            tests/setup/*.sh

      - name: Run actionlint
        shell: bash
        run: actionlint

      - name: Validate config files
        shell: bash
        run: |
          python3 -m json.tool home/dot_claude/settings.json >/dev/null
          python3 -m json.tool home/private_dot_paseo/private_config.json >/dev/null
          python3 -m json.tool home/dot_config/private_karabiner/private_karabiner.json >/dev/null
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)' apm.yml
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)' apm-skills.yml
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)' apm-skills.lock.yaml
          ruby -c Brewfile >/dev/null

      - name: Check setup help
        shell: bash
        run: ./setup.sh --help

      - name: Run repository check command
        shell: bash
        run: ./setup.sh --yes check

      - name: Run setup dry-run checks
        shell: bash
        run: |
          ./setup.sh --dry-run
          ./setup.sh --dry-run --skip karabiner
          ./setup.sh --dry-run --skip macos
          ./setup.sh --dry-run check doctor

  apm-isolation:
    name: Verify isolated APM restore and MCP render
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned APM CLI
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: "true"
          apm-version: "0.28.0"
      - name: Restore skills and render MCP config in isolated homes
        run: bash scripts/verify-apm-isolated.sh
