name: dotfiles-mcp-servers
version: 1.0.0
description: Shared MCP server declarations rendered into the local Codex configuration.
targets:
- codex
includes: []
dependencies:
  apm: []
  mcp:
  - name: atlassian
    registry: false
    transport: http
    url: https://mcp.atlassian.com/v1/mcp/authv2
  - name: github
    registry: false
    transport: http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
  - name: context7
    registry: false
    transport: http
    url: https://mcp.context7.com/mcp
  - name: notion
    registry: false
    transport: http
    url: https://mcp.notion.com/mcp
  - name: gnomcp
    registry: false
    transport: stdio
    command: /bin/bash
    args:
    - -lc
    - exec "$HOME/.local/bin/gnomcp"
  - name: firecrawl
    registry: false
    transport: stdio
    command: /bin/zsh
    args:
    - -lc
    - source "$HOME/.zshrc.local" 2>/dev/null || true; exec npx -y firecrawl-mcp@3.24.0
  - name: playwright
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@playwright/mcp@0.0.79'
    env:
      PLAYWRIGHT_MCP_EXECUTABLE_PATH: /Applications/Aside.app/Contents/MacOS/Aside
  - name: aside
    registry: false
    transport: stdio
    command: aside
    args:
    - mcp
