name: dotfiles-agent-packages
version: 1.0.0
description: Shared skills and MCP servers for Codex and Oh My Pi.
targets:
  - agent-skills
  - codex

includes: []

dependencies:
  apm:
    - git: https://github.com/vercel-labs/skills.git
      path: skills/find-skills
      ref: main
    - git: https://github.com/vercel-labs/agent-skills.git
      path: skills/react-best-practices
      ref: main
      alias: vercel-react-best-practices
    - git: https://github.com/Jeffallan/claude-skills.git
      path: skills/golang-pro
      ref: main
  mcp:
    - name: atlassian
      registry: false
      transport: http
      url: https://mcp.atlassian.com/v1/mcp/authv2
    - name: github
      registry: false
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    - name: gnomcp
      registry: false
      transport: stdio
      command: /bin/bash
      args:
        - -lc
        - exec "$HOME/.local/bin/gnomcp"
    - name: firecrawl
      registry: false
      transport: stdio
      command: /bin/zsh
      args:
        - -lc
        - source "$HOME/.zshrc.local" 2>/dev/null || true; exec npx -y firecrawl-mcp
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@playwright/mcp@latest'
      env:
        PLAYWRIGHT_MCP_EXECUTABLE_PATH: /Applications/Aside.app/Contents/MacOS/Aside
    - name: aside
      registry: false
      transport: stdio
      command: aside
      args:
        - mcp
